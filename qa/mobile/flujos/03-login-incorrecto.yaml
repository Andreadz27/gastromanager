# CP-MOB-03 · Con la contraseña mal, el celular muestra el error y no entra
appId: com.android.chrome
name: CP-MOB-03 · Contraseña incorrecta en el celular
tags:
  - celular
env:
  BASE_URL: http://10.0.2.2:3000
  MOZO_EMAIL: mozo@qa.test
---
- runFlow: comunes/abrir-chrome.yaml
- openLink: ${BASE_URL}/
- extendedWaitUntil:
    visible: "Tu negocio, a punto."
    timeout: 20000
# Chrome expone el id del HTML como resource-id
- tapOn:
    id: "loginEmail"
- inputText: ${MOZO_EMAIL}
# Enter con la contraseña vacía: el navegador no envía y pasa el foco a la contraseña (tocarla falla si el teclado
# movió la página)
- pressKey: Enter
- inputText: "incorrecta"
# Enter envía el formulario (hideKeyboard, sin teclado abierto, funciona como Atrás y cierra Chrome)
- pressKey: Enter
# El error aparece debajo del botón: con el teclado abierto queda tapado. Acá el teclado sí está abierto
- hideKeyboard
- extendedWaitUntil:
    visible: "Credenciales incorrectas"
    timeout: 10000
- assertNotVisible: ".*Mesa 1.*"
- takeScreenshot: cp-mob-03-error
