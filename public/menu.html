<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Carta digital de GastroManager - Explorá nuestro menú con entradas, platos principales, bebidas, postres y más. Pedí directo desde la mesa escaneando el código QR.">
  <meta name="theme-color" content="#f97316">
  <title>Carta Digital - GastroManager</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="menu-body">
  <!-- Hero / Header -->
  <header class="menu-hero">
    <div class="menu-hero-bg"></div>
    <div class="menu-hero-content">
      <div class="menu-hero-logo"><i class="fas fa-utensils"></i></div>
      <h1 id="menuRestNombre">Carta digital</h1>
      <p id="menuRestSub"></p>
    </div>
  </header>

  <!-- Mobile category nav (sticky bottom on mobile) -->
  <nav class="mobile-cat-nav" id="mobileCatNav" aria-label="Navegación de categorías">
    <div class="mobile-cat-scroll" id="mobileCatScroll"></div>
  </nav>

  <!-- Main content -->
  <main class="menu-container" id="menuContainer">
    <div class="menu-categories" id="menuCategorias" role="tablist" aria-label="Categorías del menú"></div>
    <div class="menu-items" id="menuItems" role="tabpanel"></div>
  </main>

  <!-- Footer -->
  <footer class="menu-footer" role="contentinfo">
    <div class="menu-footer-grid">
      <!-- Datos del restaurante: se completan desde la configuración del negocio -->
      <div class="menu-footer-brand">
        <div class="menu-footer-logo"><i class="fas fa-utensils"></i></div>
        <h3 id="footerNombre"></h3>
        <p>Gracias por visitarnos. Consultá a tu mozo por los platos del día.</p>
      </div>
      <nav class="menu-footer-nav" aria-label="Enlaces">
        <h4>Pedidos</h4>
        <ul>
          <li><a href="#menuContainer"><i class="fas fa-utensils"></i> Ver la carta</a></li>
          <li><a href="/pedido.html"><i class="fas fa-motorcycle"></i> Pedir para llevar o delivery</a></li>
        </ul>
      </nav>
      <div class="menu-footer-contact" id="contacto">
        <h4>Contacto</h4>
        <address>
          <p id="footerDireccionFila" hidden><i class="fas fa-map-marker-alt"></i> <span id="footerDireccion"></span></p>
          <p id="footerTelefonoFila" hidden><i class="fas fa-phone"></i> <a id="footerTelefono"></a></p>
          <p id="footerEmailFila" hidden><i class="fas fa-envelope"></i> <a id="footerEmail"></a></p>
        </address>
      </div>
    </div>
    <div class="menu-footer-bottom">
      <p class="menu-footer-copy">&copy; <span id="footerYear"></span> <span id="footerCopyNombre"></span></p>
      <p class="menu-footer-made">Carta digital con GastroManager</p>
    </div>
  </footer>

  <script src="js/menu.js"></script>
</body>
</html>
