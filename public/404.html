<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Página no encontrada - GastroManager</title>
  <meta name="description" content="La página que buscas no existe. Volvé al inicio o a la carta digital.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e1e2e 0%,#16213e 50%,#0f0f23 100%);color:#fff;padding:20px}
    .error-card{text-align:center;max-width:420px;width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:60px 40px;backdrop-filter:blur(20px);box-shadow:0 25px 50px -12px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.02) inset}
    .error-code{font-size:120px;font-weight:800;background:linear-gradient(135deg,#f97316,#ef4444,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:8px;animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
    .error-title{font-size:28px;font-weight:700;margin-bottom:12px;color:#f1f5f9}
    .error-desc{color:#94a3b8;font-size:16px;line-height:1.6;margin-bottom:32px}
    .btn{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:14px;font-weight:600;font-size:15px;text-decoration:none;transition:all .2s;cursor:pointer;border:none}
    .btn-primary{background:linear-gradient(135deg,#f97316,#ef4444);color:#fff;box-shadow:0 8px 24px rgba(249,115,22,0.4)}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(249,115,22,0.5)}
    .btn-ghost{background:rgba(255,255,255,0.06);color:#e2e8f0;border:1px solid rgba(255,255,255,0.1)}
    .btn-ghost:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.2)}
    .btn-group{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:32px}
    .error-decoration{display:flex;justify-content:center;gap:8px;margin-top:24px}
    .error-decoration span{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#f97316,#ec4899);animation:float 3s ease-in-out infinite}
    .error-decoration span:nth-child(2){animation-delay:.2s}
    .error-decoration span:nth-child(3){animation-delay:.4s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .brand-footer{font-size:13px;color:#64748b;margin-top:16px}
    .brand-footer a{color:#f97316;text-decoration:none}
    .brand-footer a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Página no encontrada</h1>
    <p class="error-desc">Lo sentimos, la página que buscas no existe o ha sido movida. Podés volver al inicio o explorar la carta digital.</p>
    <div class="btn-group">
      <a href="/" class="btn btn-primary"><i class="fas fa-home"></i> Inicio</a>
      <a href="/menu.html" class="btn btn-ghost"><i class="fas fa-utensils"></i> Carta Digital</a>
    </div>
    <div class="error-decoration"><span></span><span></span><span></span></div>
    <p class="brand-footer">GastroManager &copy; <span id="year"></span> &mdash; <a href="/">Sistema de Gestión Gastronómica</a></p>
  </div>
  <script>document.getElementById('year').textContent=new Date().getFullYear()</script>
</body>
</html>
